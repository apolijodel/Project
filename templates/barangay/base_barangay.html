<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}System{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    {% block head %}{% endblock %}
</head>

<body class="dashboard-body">

<!-- HEADER -->
<header class="dashboard-header">
    <div class="header-left">
        <img src="{{ url_for('static', filename='logow.png') }}" class="dashboard-logo">
        <h1>City Management Dashboard</h1>
    </div>

    <div class="header-right">
        <span>Welcome, {{ username }} (Barangay)</span>
        <a href="{{ url_for('auth.logout') }}" class="logout-btn">Logout</a>
    </div>
</header>

<div class="dashboard-main">

    <!-- SIDEBAR -->
    <nav class="dashboard-sidebar">
        <ul>
           <li>
    <li>
  <a href="{{ url_for('barangay.dashboard') }}">
    <i class="fas fa-home icon"></i>
    <span class="text">Dashboard</span>
  </a>
</li>

<li>
  <a href="{{ url_for('barangay.request_supplies') }}">
    <i class="fas fa-paper-plane icon"></i>
    <span class="text">Request Supplies</span>
  </a>
</li>

<li>
  <a href="{{ url_for('barangay.inventory') }}">
    <i class="fas fa-box icon"></i>
    <span class="text">Inventory</span>
  </a>
</li>
        </ul>
    </nav>

    <!-- PAGE CONTENT -->
    <div class="dashboard-content">
        {% block content %}{% endblock %}
    </div>

</div>

</body>
</html>
