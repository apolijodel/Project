<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}System{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    {% block head %}{% endblock %}
</head>

<body class="dashboard-body">

<!-- HEADER -->
<header class="dashboard-header">
    <div class="header-left">
        <img src="{{ url_for('static', filename='logow.png') }}" class="dashboard-logo">
        <h1>City Management Dashboard</h1>
    </div>

    <div class="header-right">
        <span>Welcome, {{ username }} (City Admin)</span>
        <a href="{{ url_for('auth.logout') }}" class="logout-btn">Logout</a>
    </div>
</header>

<!-- MAIN LAYOUT -->
<div class="dashboard-main">

    <!-- SIDEBAR -->
    <nav class="dashboard-sidebar">
        <ul>
            <li>
                <a href="{{ url_for('city.dashboard') }}">
                    <i class="fas fa-home icon"></i>
                    <span class="text">Dashboard</span>
                </a>
            </li>

            <li>
                <a href="{{ url_for('city.all_barangays') }}">
                    <i class="fas fa-city icon"></i>
                    <span class="text">All Barangays</span>
                </a>
            </li>

            <li>
                <a href="{{ url_for('city.reports') }}">
                    <i class="fas fa-chart-line icon"></i>
                    <span class="text">Reports</span>
                </a>
            </li>

            <li>
                <a href="{{ url_for('city.supply') }}">
                    <i class="fas fa-truck icon"></i>
                    <span class="text">Supply Distribution</span>
                </a>
            </li>

            <li>
                <a href="{{ url_for('city.view_requests') }}">
                    <i class="fas fa-clipboard-list icon"></i>
                    <span class="text">Requests</span>
                </a>
            </li>
            <li></li>
            <a href="{{ url_for('city.add_stock') }}">
                    <i class="fas fa-boxes"></i>
                     <span class="text">Add Stock</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('city.manage_users') }}">
                    <i class="fas fa-users icon"></i>
                    <span class="text">User Management</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- CONTENT -->
    <main class="dashboard-content">
        {% block content %}{% endblock %}
    </main>

</div>

</body>
</html>
