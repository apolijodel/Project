{% extends "city/base_dashboard.html" %}

{% block title %}User Management{% endblock %}

{% block content %}

<h2>User Management</h2>

<div class="form-card">
    <form method="POST" action="{{ url_for('city.add_user') }}">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <select name="role" required>
            <option value="barangay">Barangay</option>
            <option value="city">City</option>
        </select>

        <button type="submit">Add User</button>

    </form>
</div>

<div class="table-section">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
        {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.role }}</td>
                <td>
                    <a href="{{ url_for('city.delete_user', id=user.id) }}">
                        Delete
                    </a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
